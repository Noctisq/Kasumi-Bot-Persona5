name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Build happens ON the VM, not on this runner — @discordjs/opus and
      # friends have native bindings that must be compiled for the machine
      # that actually runs them.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/Kasumi-Bot-Persona5
            git pull
            pnpm install --frozen-lockfile
            npx tsc
            pnpm --filter activity-client run build
            systemctl --user restart kasumi-bot
